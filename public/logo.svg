<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 42" width="176" height="42" fill="none">
  <defs>
    <!-- Primary Orbit Gradient -->
    <linearGradient id="ow-grad-primary" x1="4" y1="6" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Counter Orbit Gradient -->
    <linearGradient id="ow-grad-secondary" x1="36" y1="6" x2="4" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="60%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Central Core Gradient -->
    <radialGradient id="ow-grad-core" cx="20" cy="21" r="7" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="65%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </radialGradient>

    <!-- Work Text Gradient -->
    <linearGradient id="ow-grad-text" x1="102" y1="12" x2="162" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Subtle Drop Shadow for Core -->
    <filter id="ow-shadow" x="10" y="11" width="20" height="20" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#1E40AF" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ICON MARK (x: 2 to 38, y: 3 to 39) -->
  <g id="orbit-mark">
    <!-- Outer Ellipse 1 (Rotated -35 deg) -->
    <ellipse cx="20" cy="21" rx="15" ry="5.5" 
             transform="rotate(-35 20 21)" 
             stroke="url(#ow-grad-primary)" 
             stroke-width="2.6" 
             stroke-linecap="round"/>

    <!-- Outer Ellipse 2 (Rotated 35 deg) -->
    <ellipse cx="20" cy="21" rx="15" ry="5.5" 
             transform="rotate(35 20 21)" 
             stroke="url(#ow-grad-secondary)" 
             stroke-width="2.4" 
             stroke-dasharray="28 8 16 6"
             stroke-linecap="round"/>

    <!-- Central Planet Core -->
    <circle cx="20" cy="21" r="5.6" fill="url(#ow-grad-core)" filter="url(#ow-shadow)"/>
    <circle cx="18.5" cy="19" r="1.6" fill="#FFFFFF" fill-opacity="0.6"/>

    <!-- Orbit Satellite Nodes -->
    <circle cx="31.8" cy="11.8" r="2.2" fill="#38BDF8"/>
    <circle cx="8.5" cy="29.2" r="1.8" fill="#818CF8"/>
  </g>

  <!-- LOGOTYPE "OrbitWork" -->
  <g id="brand-text">
    <text x="46" y="28.5" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" 
          font-size="22" 
          font-weight="800" 
          letter-spacing="-0.6px">
      <tspan fill="#0F172A">Orbit</tspan>
      <tspan fill="url(#ow-grad-text)" font-weight="800">Work</tspan>
    </text>
    <!-- Accent Sparkle Dot -->
    <circle cx="166" cy="16.5" r="2.2" fill="#2563EB"/>
  </g>
</svg>